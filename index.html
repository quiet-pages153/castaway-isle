  :root{--ink:#FFF6E2;--sub:#D7DCE8;--gold:#F2C14E;--red:#D9452F;--redD:#8E2416;--glass:rgba(16,22,34,.58);--rim:rgba(255,246,226,.38)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12202b;color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
  [hidden]{display:none!important}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
  .jua{font-family:'Jua',system-ui,sans-serif;font-weight:400}
  .ic{display:inline-block;width:24px;height:24px;background:url(ui_icons.png) no-repeat;background-size:400% 300%;flex-shrink:0}
  .ic.wood{background-position:0 0}.ic.coconut{background-position:33.333% 0}.ic.stone{background-position:66.667% 0}.ic.vine{background-position:100% 0}
  .ic.shell{background-position:0 50%}.ic.berries{background-position:33.333% 50%}.ic.axe{background-position:66.667% 50%}.ic.palm{background-position:100% 50%}
  .ic.branch{background-position:0 100%}
  .craft{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 1.5rem);z-index:5;
    display:flex;align-items:center;gap:.5rem;background:rgba(40,30,12,.82);border:1.5px solid var(--gold);border-radius:999px;padding:.25rem .25rem .25rem .75rem;font-size:.9375rem;font-weight:600;
    box-shadow:0 0 14px rgba(242,193,78,.35);animation:pop .4s}
  .craft .ic{width:28px;height:28px}
  .craft button{min-height:40px;border:none;border-radius:999px;background:var(--gold);color:#3a2608;font-weight:700;padding:0 .875rem;cursor:pointer;flex-shrink:0}
  .craft .x{background:transparent;color:var(--ink);padding:0 .5rem;font-size:1.125rem}

  /* ---------- 첫 화면 ---------- */
  #selectScreen{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(10,20,30,.2),rgba(10,20,30,.85) 72%),url(floor_beachA.png) 62% 40%/auto 160% no-repeat #12202b;
    padding:calc(env(safe-area-inset-top) + 2rem) 1rem calc(env(safe-area-inset-bottom) + 1.5rem)}
  .sel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:1rem}
  .logo{text-align:center;font-size:3.25rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 #6b3d12,0 0 18px rgba(0,0,0,.45);letter-spacing:.04em;margin:0}
  .tag{text-align:center;color:var(--ink);font-size:.9375rem;margin:.375rem 0 0;text-shadow:0 1px 3px rgba(0,0,0,.8)}

  /* ---------- 게임: 그림 위에 모든 조작 ---------- */

  /* ---------- 가방 ---------- */

  .ic.sharp,.ic.vineBundle{background-image:url(beach_tools.png);background-size:600% 200%;background-position:10% 100%}

  .knob{background:radial-gradient(circle at 36% 32%,#a67a55,#5b3d2b 76%);border:1px solid #c39b70}
  .act{width:72px;height:72px;background:#3c2b24d9;border:2px solid #956748;box-shadow:inset 0 0 0 3px #241b1a}
  .act.on{background:#543b2f;box-shadow:inset 0 0 0 3px #2e201b,0 2px 5px #151014a0}

  .act.on .ic{transform:translateY(-5px);width:42px;height:42px}
  .quickBar + .bagVeil{z-index:8}
  .objective{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 76px);margin:0;background:#171b26cc;border:1px solid #a7855a66;border-radius:6px;padding:3px 8px;font-size:12px;pointer-events:none}
  .hint{top:calc(env(safe-area-inset-top) + 108px)}

    display:flex;gap:6px;padding:4px;background:#271f1ce6;border:1px solid #976c4a;border-radius:5px;white-space:nowrap}

  .bagVeil{position:absolute;inset:0;background:rgba(6,10,18,.38);z-index:8}

    border:22px solid transparent;border-image:url(ui_frame.png) 56 fill / 22px round;color:#4A2A12;padding:4px 6px 6px;z-index:9;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:up .22s ease-out}

  /* ---------- 메뉴·창·띠 ---------- */
  .veil{position:fixed;inset:0;background:rgba(6,10,18,.62);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
  .box{width:100%;max-width:360px;background:#1d2738;border:2px solid var(--rim);border-radius:1.25rem;padding:1rem;display:flex;flex-direction:column;gap:.625rem;max-height:90vh;overflow-y:auto}

  .band{position:fixed;left:.5rem;right:.5rem;top:calc(env(safe-area-inset-top) + .5rem);max-width:504px;margin:0 auto;z-index:15;background:#2b3a1f;border:2px solid var(--gold);border-radius:.875rem;

  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:10px auto;max-width:360px}

  .quickBar .ic{width:min(40px,100%);height:40px}.quickBar .bagBtn svg{width:39px;height:39px}.quickBar .bagBtn{right:auto}
  .quickBar .emptyIcon{opacity:.30}.quickBar .assigning{outline:1px solid #dfb574;outline-offset:-2px}

  .quickHint button,.campChoices button,.placeX{border:1px solid #a88360;border-radius:5px;min-height:34px;background:#50382b;color:#fff2dc;padding:5px 9px}

  .act:disabled{opacity:.63;cursor:default}.campChoices button:disabled{opacity:.43}

  .gauges.hungry .g.hp svg{animation:lowPulse 1.7s ease-in-out infinite}@keyframes lowPulse{50%{opacity:.45}}
  .objective strong{color:#ffdf9c;font-size:14px}.objective small{color:#fbefdb;font-size:12px}
  .hint{top:calc(env(safe-area-inset-top) + 117px)}

    background:#fff1d6;color:#2b201d;border:2px solid #4c372b;border-radius:9px;font-size:14px;line-height:1.35;box-shadow:0 2px #281e19a0;pointer-events:none}

<body>
<section id="selectScreen" aria-label="첫 화면">
  <div class="sel">
    <div>
      <h1 class="logo jua">표류섬</h1>

    </div>
    <div class="pick">
      <button type="button" class="who" data-ch="boy" aria-pressed="true"><canvas width="300" height="400" aria-hidden="true"></canvas><b>소년</b><span>나무 베기·사냥이 빠름</span></button>
      <button type="button" class="who" data-ch="girl" aria-pressed="false"><canvas width="300" height="400" aria-hidden="true"></canvas><b>소녀</b><span>낚시·요리·제작이 빠름</span></button>

    <div class="names"><label>소년 이름<input id="boyName" maxlength="12" placeholder="소년" autocomplete="off"></label><label>소녀 이름<input id="girlName" maxlength="12" placeholder="소녀" autocomplete="off"></label></div>
    <button type="button" class="start" id="startBtn">모험 시작</button>

const SRC_H = 230;
function drawFrame(c, ch, anim, i, x, y, h, flip){
  const list = FRAMES[ch][anim]; if(!list) return;
  const f = list[i % list.length], im = IMG[f[6]?ch+'_'+f[6]:ch]; if(!im.complete) return;   // 'x' = 나중에 받은 동작 묶음

  c.save(); c.translate(x,y); if(flip) c.scale(-1,1);
  c.drawImage(im, sx,sy,sw,sh, -ax*s, -ay*s, sw*s, sh*s);
  c.restore();
}

function canPlace(type,x,y){

  if(Math.hypot(x-st.x,y-st.y)>165||Math.abs(x-st.x)<w+6&&Math.abs(y-st.y)<h+5) return false;
  if((MAP.exits||[]).some(e=>e.side==='left'?x-w<44:x+w>WORLD.w-44)) return false;
  for(const ox of [-w,0,w]) for(const oy of [-h,0,h]){
    if(zoneAt(x+ox,y+oy)>1 || !walkable(x+ox,y+oy) || noteAt(x+ox,y+oy)) return false;
  }
  if(objs.some(o=>{
    const [ow,oh]=SOLID[o.type]||[12,8];
    return Math.abs(o.x-x)<w+ow && Math.abs(o.y-y)<h+oh;
  })) return false;

const DROP={food:40/DAY, water:50/DAY};

let warned={};
function survive(dt){
  st.food=Math.max(0,st.food-DROP.food*dt); st.water=Math.max(0,st.water-DROP.water*dt);
  const starving=(st.food<=0)+(st.water<=0);
  const cold=isNight()&&!objs.some(o=>
    (o.type==='fire'&&o.fuel>0&&Math.hypot(o.x-st.x,o.y-st.y)<WARM_RADIUS)||
    (o.type==='hut'&&o.readyAt<=camp.elapsed&&Math.abs(o.x-st.x)<58&&Math.abs(o.y-st.y)<44));
  const chilled=cold && !camp.cold;
  camp.cold=cold;
  if(starving||cold) st.hp=Math.max(0,st.hp-HP_LOSS*(starving+Number(cold))*dt);
  else if(st.food>30&&st.water>30) st.hp=Math.min(100,st.hp+HP_GAIN*dt);
  for(const k of ['food','water']){ const low=st[k]<=20; if(low&&!warned[k]){ warned[k]=1; hint(k==='food'?'배가 고파요. 가방에서 먹을 것을 찾아보세요':'목이 말라요. 코코넛을 마셔 보세요',2.6); } if(st[k]>30) warned[k]=0; }
  if(chilled) hint('밤공기가 차가워요. 모닥불 근처로 가세요',3);
  if(st.hp<=0) faint();
}

const shadowCache={};
function shadowSprite(w,h,box){
  const k=w+'x'+h+(box?'b':''); if(shadowCache[k]) return shadowCache[k];
  const cw=Math.max(1,Math.round(w/3)), chh=Math.max(1,Math.round(h/3));
  const c=document.createElement('canvas'); c.width=cw; c.height=chh; const g=c.getContext('2d');
  const id=g.createImageData(cw,chh), rx=cw/2, ry=chh/2;

function crabOk(x,y){ const z=zoneAt(x,y); return z>=1 && z<=3 && x>20 && x<WORLD.w-20; }   // 게는 지도를 안 넘어감
function updateCrabs(dt){
  for(const c of crabs){
    if(Math.hypot(st.x-c.x,(st.y-c.y)*1.4)<95){ c.mode='flee'; c.timer=.9; c.dir=st.x<c.x?1:-1; }
    c.timer-=dt;
    if(c.timer<=0){
      if(c.mode==='idle'){ c.mode='walk'; c.timer=.8+Math.random()*1.4; const back=c.x-c.hx; c.dir=Math.abs(back)>70?(back>0?-1:1):(Math.random()<.5?-1:1); }
      else { c.mode='idle'; c.timer=1+Math.random()*2; }
    }
    const sp=c.mode==='flee'?115:c.mode==='walk'?38:0;
    if(sp){ const nx=c.x+c.dir*sp*dt; if(crabOk(nx,c.y)){ c.dist+=Math.abs(nx-c.x); c.x=nx; } else c.dir*=-1; }

const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let bip=null; const bipWait=Date.now();
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); bip=e; });
addEventListener('appinstalled',()=>{ bip=null; installMsg('설치했어요. 이 창은 닫고 홈 화면의 표류섬 아이콘으로 열어 주세요.'); });
const installBtn=document.getElementById('installBtn');
if(standalone) installBtn.hidden=true;
function installMsg(t){ const p=document.getElementById('installMsg'); p.textContent=t; p.hidden=false; }
installBtn.addEventListener('click',async()=>{
  if(inApp){ installMsg(isIOS?'이 앱 안에서는 설치가 안 돼요. 공유(또는 ⋯) → "Safari로 열기"를 눌러 주세요.':'이 앱 안에서는 설치가 안 돼요. 오른쪽 위 점 세 개 → "다른 브라우저로 열기"를 눌러 주세요.'); return; }
  if(isIOS){ installMsg('Safari 공유 버튼(네모에 위 화살표, 안 보이면 ⋯ 안) → 목록을 위로 올려 "홈 화면에 추가"를 눌러 주세요.'); return; }
  if(bip){ bip.prompt(); const r=await bip.userChoice; bip=null; if(r.outcome==='accepted') installMsg('설치했어요. 홈 화면의 표류섬 아이콘으로 열어 주세요.'); return; }
  if(Date.now()-bipWait<8000) installMsg('설치 준비 중이에요. 몇 초 뒤에 다시 눌러 주세요.');
  else installMsg('크롬 오른쪽 위 점 세 개(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요. 삼성 인터넷은 아래 메뉴 → 현재 페이지 추가 → 홈 화면.');
});
// 카톡 등 앱 안 브라우저 안내
if(inApp && web){
  const ib=document.getElementById('inappBand'); ib.hidden=false;
  const btn=document.getElementById('inappBtn');
  if(isIOS){ document.getElementById('inappText').textContent='이 앱 안에서는 설치가 안 돼요. 공유 → "Safari로 열기"를 눌러 주세요.'; btn.hidden=true; }
  else btn.addEventListener('click',()=>{ location.href='intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end'; setTimeout(()=>{ document.getElementById('inappText').textContent='안 열리면 오른쪽 위 점 세 개 → "다른 브라우저로 열기"를 눌러 주세요.'; },1500); });
}

window.__st=st; window.__objs=()=>objs; window.__crabs=()=>crabs; window.__loaded=()=>loaded; window.__cam=cam; window.__zoneAt=(x,y)=>zoneAt(x,y);
window.__map=()=>cur; window.__survive=sec=>{ for(let i=0;i<sec*10;i++) survive(.1); renderGauges(); }; window.__bagOpen=bagOpen; window.__go=(k,x,y)=>enterMap(k,x,y,true); window.__walkable=(x,y)=>walkable(x,y);
})();
</script>
