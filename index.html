  :root{--ink:#FFF6E2;--sub:#D7DCE8;--gold:#F2C14E;--red:#D9452F;--redD:#8E2416;--glass:rgba(16,22,34,.58);--rim:rgba(255,246,226,.38)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12202b;color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
  [hidden]{display:none!important}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
  .jua{font-family:'Jua',system-ui,sans-serif;font-weight:400}
  .ic{display:inline-block;width:24px;height:24px;background:url(ui_icons.png) no-repeat;background-size:400% 300%;flex-shrink:0}
  .ic.wood{background-position:0 0}.ic.coconut{background-position:33.333% 0}.ic.stone{background-position:66.667% 0}.ic.vine{background-position:100% 0}
  .ic.shell{background-position:0 50%}.ic.berries{background-position:33.333% 50%}.ic.axe{background-position:66.667% 50%}.ic.palm{background-position:100% 50%}
  .ic.branch{background-position:0 100%}
  .craft{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 1.5rem);z-index:5;
    display:flex;align-items:center;gap:.5rem;background:rgba(40,30,12,.82);border:1.5px solid var(--gold);border-radius:999px;padding:.25rem .25rem .25rem .75rem;font-size:.9375rem;font-weight:600;
    box-shadow:0 0 14px rgba(242,193,78,.35);animation:pop .4s}
  .craft .ic{width:28px;height:28px}
  .craft button{min-height:40px;border:none;border-radius:999px;background:var(--gold);color:#3a2608;font-weight:700;padding:0 .875rem;cursor:pointer;flex-shrink:0}
  .craft .x{background:transparent;color:var(--ink);padding:0 .5rem;font-size:1.125rem}

  /* ---------- 첫 화면 ---------- */
  #selectScreen{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(10,20,30,.2),rgba(10,20,30,.85) 72%),url(floor_beachA.png) 62% 40%/auto 160% no-repeat #12202b;
    padding:calc(env(safe-area-inset-top) + 2rem) 1rem calc(env(safe-area-inset-bottom) + 1.5rem)}
  .sel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:1rem}
  .logo{text-align:center;font-size:3.25rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 #6b3d12,0 0 18px rgba(0,0,0,.45);letter-spacing:.04em;margin:0}
  .tag{text-align:center;color:var(--ink);font-size:.9375rem;margin:.375rem 0 0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-top:.5rem}
  .who{background:rgba(16,22,34,.55);border:2px solid var(--rim);border-radius:1.125rem;padding:.625rem .5rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer;min-width:0}

// ---------- 지도 (여러 장, 가장자리로 걸어서 넘어감) ----------
const WORLD = {w:1536, h:1024}, KNEE=30;
// 구역: 0 풀, 1 모래, 2 젖은 모래, 3 얕은 물, 4 깊은 바다, 5 절벽(못 감) — 지도마다 4px 칸 (줄마다 '구역+개수' 묶음을 풂)
const ZONES={};
for(const k in BEACH.zones){ const Z=BEACH.zones[k], g=new Uint8Array(Z.w*Z.h);
  Z.rle.forEach((row,r)=>{ let c=0; for(const p of row.split(',')){ const v=+p[0], n=+p.slice(1); g.fill(v,r*Z.w+c,r*Z.w+c+n); c+=n; } });
  ZONES[k]={Z,g}; }
let cur='beachA', Z=ZONES[cur].Z, ZG=ZONES[cur].g, MAP=MAPS[cur];
function zoneAt(x,y){
  const c=Math.min(Z.w-1,Math.max(0,Math.floor(x/Z.cell))), r=Math.min(Z.h-1,Math.max(0,Math.floor(y/Z.cell)));
  return ZG[r*Z.w+c];
}
// 물에 잠기는 깊이: 발에서 위로 물가까지의 거리 (물가에 막 들어서면 조금, 안쪽으로 갈수록 무릎까지)
const isWater=z=>z===3||z===4, BLOCK=z=>z===4||z===5;
function waterDepth(x,y){ if(!isWater(zoneAt(x,y))) return 0; let d=0; while(d<KNEE && isWater(zoneAt(x,y-d-2))) d+=2; return d; }
const OB = BEACH.objs, K = BEACH.k;
const SOLID = {tree:[16,8], palm:[13,7], stump:[16,7], rock_big:[52,16], rock_pile:[42,12], wreck:[100,18], crate:[26,10], log:[30,8]};   // 덤불은 지나갈 수 있음
const BUSH = {bush_berry:1, bush_empty:1};
// 이름 (가까이 가면 위에 뜸)
const NAME = {branch:'나뭇가지', crab:'게', tree:'나무', palm:'야자수', coconut:'코코넛', shell_conch:'소라 껍데기', shell_clam:'대합', shell_scallop:'가리비', stone:'돌', vine:'덩굴', driftwood:'유목', bush_berry:'열매 덤불'};
// 가방에 들어가는 것: [아이콘, 이름]
const ITEMS = {axe:['axe','돌도끼'], branch:['branch','나뭇가지'], wood:['wood','목재'], coconut:['coconut','코코넛'], berries:['berries','열매'], shell:['shell','조개'], stone:['stone','돌'], vine:['vine','덩굴']};
// 가방 칸: 음식·도구만 칸 수 제한 (음식은 한 칸에 같은 것 5개까지), 재료는 개수 제한 없음
const FOODS = ['coconut','berries'], TOOLS = ['axe'], MATS = ['wood','branch','stone','vine','shell'];
const FOOD_SLOTS=10, TOOL_SLOTS=5, STACK=5;
const EAT = {coconut:{food:5, water:8}, berries:{food:3}};   // 먹으면 오르는 양 (배고픔·목마름 100 기준)
const PICK = {branch:['branch',1], coconut:['coconut',1], shell_conch:['shell',1], shell_clam:['shell',1], shell_scallop:['shell',1], stone:['stone',1], vine:['vine',1], driftwood:['wood',1]};
// 가까이 가면 버튼이 바뀌는 것
const A_CHOP={label:'베기', icon:'axe', anim:'chop'}, A_SHAKE_TREE={label:'흔들기', icon:'branch', anim:'shake'};
const ACTIONS = {
  palm:     {label:'흔들기', icon:'coconut', anim:'shake', when:o=>o.nuts>0},
  bush_berry:{label:'따기',  icon:'berries', anim:'pick'},
};
for(const k in PICK) ACTIONS[k]={label:'줍기', icon:PICK[k][0], anim:'pick', when:o=>!o.fall};
// 나무: 도끼가 없으면 흔들기(나뭇가지), 있으면 베기
function actionOf(o){
  if(o.type==='tree') return inv.axe>0 ? A_CHOP : (o.branches>0 ? A_SHAKE_TREE : null);
  const a=ACTIONS[o.type]; return a && (!a.when||a.when(o)) ? a : null;
}
// 조합표: 재료가 처음 다 모이면 "만들 수 있어요" 알림
const RECIPES = [
  {id:'axe', name:'돌도끼', need:{branch:1, stone:1, vine:1}, msg:'이제 나무를 벨 수 있어요'},
];

let objs=[], inv={}, crabs=[], leaves=[], told={}, world={};   // world[지도] = {objs, crabs} — 다른 지도에 갔다 와도 그대로
function resetWorld(){
  let pi=0; world={};
  for(const k in MAPS){
    world[k]={
      objs: MAPS[k].objects.map(([type,x,y])=>{ const spr=type==='palm'?(pi++%2?'palm_s':'palm_b'):type;   // 휜 야자수(코코넛 3)·곧은 야자수(2)를 번갈아
        const nuts=spr==='palm_b'?3:spr==='palm_s'?2:0;
        return {type,spr,x,y,hp:type==='tree'?3:0,branches:type==='tree'?2:0,nuts,maxNuts:nuts,shake:0,fall:0}; }),
      crabs: MAPS[k].crabs.map(([x,y])=>({x,y,hx:x,hy:y,dir:Math.random()<.5?-1:1,mode:'idle',timer:Math.random()*2,dist:0,f:0}))};
  }

  inv = {axe:0,branch:0,wood:0,coconut:0,berries:0,shell:0,stone:0,vine:0}; st.inv=inv; renderInv();
  st.dir='down'; st.act=null; st.wood=0; st.t=0; st.hp=100; st.food=70; st.water=60; warned={}; selFood=null; bagTab='bag'; closeBag(); renderGauges();
  enterMap('beachA', MAPS.beachA.start[0], MAPS.beachA.start[1], true);

// 지도 바꾸기: 구역·물건·게를 그 지도 것으로
function enterMap(k,x,y,first){
  cur=k; Z=ZONES[k].Z; ZG=ZONES[k].g; MAP=MAPS[k]; objs=world[k].objs; crabs=world[k].crabs; leaves=[];
  for(let d=0; d<400 && !walkable(x,y); d+=4){ if(walkable(x,y-d)){ y-=d; break; } if(walkable(x,y+d)){ y+=d; break; } }   // 넘어간 자리가 물·물건이면 가까운 땅으로
  st.x=x; st.y=y; st.depth=waterDepth(x,y); st.act=null; st.target=null; camInit=true; lastAct=null;
  cv.setAttribute('aria-label',MAP.name);

}
const FADE=.35; let fadeT=0;
// 가장자리 출구: 걸어서 화면 끝에 닿으면 이어진 지도로
function exitAt(nx){
  for(const e of MAP.exits||[]){
    if(e.side==='right' && nx>WORLD.w-14) return [e.to, 16];
    if(e.side==='left' && nx<14) return [e.to, WORLD.w-16];
  }
  return null;
}
// 못 가는 곳에 부딪히면 알려 줌 (절벽·막힌 숲길)
function noteAt(x,y){
  for(const n of MAP.notes||[]){
    if(n.zone!==undefined && (zoneAt(x,y)===n.zone||zoneAt(x-10,y)===n.zone||zoneAt(x+10,y)===n.zone||zoneAt(x,y-12)===n.zone)) return n.text;
    if(n.box && x>=n.box[0] && x<=n.box[2] && y>=n.box[1] && y<=n.box[3]) return n.text;
  }
  return null;
}
function renderInv(changed){

function give(item,n,x,y){ inv[item]+=n; st.wood=inv.wood; renderInv(item); pops.push({text:`+${n} ${ITEMS[item][1]}`,x,y,t:0}); checkRecipes(); }
const foodSlotsUsed=(extra={})=>FOODS.reduce((s,k)=>s+Math.ceil((inv[k]+(extra[k]||0))/STACK),0);
function roomFor(item,n){ return !FOODS.includes(item) || foodSlotsUsed({[item]:n})<=FOOD_SLOTS; }
const canCraft=r=>Object.entries(r.need).every(([k,n])=>inv[k]>=n);
let cardRec=null;
function checkRecipes(){
  for(const r of RECIPES){ if(inv[r.id]>0||told[r.id]||!canCraft(r)) continue;
    told[r.id]=1; cardRec=r; document.getElementById('craftIcon').className='ic '+ITEMS[r.id][0];
    document.getElementById('craftText').textContent=r.name+'를 만들 수 있어요!'; document.getElementById('craftCard').hidden=false; return; }
}
function craft(r){
  if(!canCraft(r)) return;
  for(const [k,n] of Object.entries(r.need)) inv[k]-=n;
  inv[r.id]=(inv[r.id]||0)+1; renderInv(r.id); document.getElementById('craftCard').hidden=true;
  pops.push({text:r.name+' 완성!',x:st.x,y:st.y-130,t:0}); hint(r.msg,2.4); renderBag(); lastAct=null;
}

function openBag(tab){ if(gameScreen.hidden||!menu.hidden) return; bagTab=tab||bagTab; bagEl.hidden=false; bagVeil.hidden=false; actHeld=false; jv=[0,0]; renderBag(); }

bagEl.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ bagTab=t.dataset.tab; renderBag(); }));
function renderBag(){
  bagEl.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===bagTab)));
  if(bagTab==='craft'){ bagDetail.hidden=true; bagBody.innerHTML=''; 
    for(const r of RECIPES){
      const have=inv[r.id]>0, row=document.createElement('div'); row.className='rec2';
      const parts=have?r.msg:Object.entries(r.need).map(([k,n])=>`<i class="${inv[k]>=n?'':'no'}">${ITEMS[k][1]} ${Math.min(inv[k],n)}/${n}</i>`).join(' · ');   // 이미 있으면 재료 대신 쓰임
      row.innerHTML=`<span class="ic ${ITEMS[r.id][0]}"></span><div><strong>${r.name}</strong>${parts}</div><button type="button" ${have||!canCraft(r)?'disabled':''}>${have?'있음':'만들기'}</button>`;
      row.querySelector('button').addEventListener('click',()=>craft(r)); bagBody.appendChild(row);
    }
    return; }
  // 음식 칸: 같은 음식은 한 칸에 5개까지
  const fs=[]; for(const k of FOODS){ let n=inv[k]; while(n>0){ fs.push([k,Math.min(STACK,n)]); n-=STACK; } }
  if(selFood && !(inv[selFood]>0)) selFood=null;
  if(!selFood && fs.length) selFood=fs[0][0];
  const slot=(k,n,sel,dis)=>`<button type="button" class="slot${sel?' sel':''}" ${k?`data-food="${k}" aria-label="${ITEMS[k][1]} ${n}"`:'aria-label="빈 칸"'} ${dis?'disabled':''}>${k?`<span class="ic ${ITEMS[k][0]}"></span>`:''}${n>1?`<b>${n}</b>`:''}</button>`;
  let h=`<div class="sec"><h3>음식 <small>${FOOD_SLOTS}칸 중 ${fs.length}칸</small></h3><div class="slots">`;
  const firstSel=fs.findIndex(f=>f[0]===selFood);   // 같은 음식이 여러 칸이면 첫 칸만 표시
  for(let i=0;i<FOOD_SLOTS;i++){ const f=fs[i]; h+=f?slot(f[0],f[1],i===firstSel):slot(null,0,false,true); }
  const ts=TOOLS.filter(k=>inv[k]>0);
  h+=`</div></div><div class="sec"><h3>도구 <small>${TOOL_SLOTS}칸 중 ${ts.length}칸</small></h3><div class="slots">`;
  for(let i=0;i<TOOL_SLOTS;i++){ const k=ts[i]; h+=`<div class="slot" ${k?`aria-label="${ITEMS[k][1]}"`:''}>${k?`<span class="ic ${ITEMS[k][0]}"></span>`:''}</div>`; }
  const ms=MATS.filter(k=>inv[k]>0);
  h+=`</div></div><div class="sec"><h3>재료 <small>개수 제한 없음</small></h3>`+(ms.length?`<div class="mats">${ms.map(k=>`<span class="mat" aria-label="${ITEMS[k][1]} ${inv[k]}"><span class="ic ${ITEMS[k][0]}"></span>${inv[k]}</span>`).join('')}</div>`:`<p class="empty">아직 없어요. 나뭇가지·돌·덩굴을 주워 보세요.</p>`)+`</div>`;
  bagBody.innerHTML=h;
  bagBody.querySelectorAll('[data-food]').forEach(b=>b.addEventListener('click',()=>{ selFood=b.dataset.food; renderBag(); }));
  if(selFood){ const e=EAT[selFood];
    bagDetail.innerHTML=`<span class="ic ${ITEMS[selFood][0]}"></span><div><strong>${ITEMS[selFood][1]}</strong>${['food','water'].filter(k=>e[k]).map(k=>`${GNAME[k]} <span class="up">+${e[k]}</span>`).join(' · ')}</div><button type="button" class="eat" id="eatBtn">먹기</button>`;
    bagDetail.hidden=false; document.getElementById('eatBtn').addEventListener('click',()=>eat(selFood));
  } else { bagDetail.hidden=false; bagDetail.innerHTML=`<div>먹을 것이 없어요. 덤불 열매나 코코넛을 찾아보세요.</div>`; }
}
function eat(k){
  if(!(inv[k]>0)) return; inv[k]--; const e=EAT[k];
  if(e.food) st.food=Math.min(100,st.food+e.food); if(e.water) st.water=Math.min(100,st.water+e.water);
  const stack=pops.filter(p=>p.t<.6&&Math.abs(p.x-st.x)<5).length;   // 빨리 여러 번 먹으면 글자가 겹치지 않게 위로 쌓음
  pops.push({text:['food','water'].filter(q=>e[q]).map(q=>`${GNAME[q]} +${e[q]}`).join(' '),x:st.x,y:st.y-130-stack*20,t:0});
  renderGauges(); renderBag();
}

// ---------- 생존: 배고픔·목마름은 시간에 따라 줄고, 0이면 체력이 줄어듦 ----------
const DAY=900;                                   // 낮 15분(초) 동안 배고픔 40, 목마름 50 줄어듦
const DROP={food:40/DAY, water:50/DAY};
const HP_LOSS=1/4, HP_GAIN=1/10;                 // 굶거나 목마르면 4초에 1씩 줄고, 둘 다 30 넘으면 10초에 1씩 참
const REGROW=240;                                // 코코넛·열매는 4분마다 다시 열림
let warned={};
function survive(dt){
  st.food=Math.max(0,st.food-DROP.food*dt); st.water=Math.max(0,st.water-DROP.water*dt);
  const starving=(st.food<=0)+(st.water<=0);
  if(starving) st.hp=Math.max(0,st.hp-HP_LOSS*starving*dt);
  else if(st.food>30&&st.water>30) st.hp=Math.min(100,st.hp+HP_GAIN*dt);
  for(const k of ['food','water']){ const low=st[k]<=20; if(low&&!warned[k]){ warned[k]=1; hint(k==='food'?'배가 고파요. 가방에서 먹을 것을 찾아보세요':'목이 말라요. 코코넛을 마셔 보세요',2.6); } if(st[k]>30) warned[k]=0; }
  if(st.hp<=0) faint();
  for(const k in world) for(const o of world[k].objs){            // 다시 열림 (다른 지도도 시간이 흐름)
    if(o.type==='palm' && o.nuts<o.maxNuts){ o.regrow=(o.regrow??REGROW)-dt; if(o.regrow<=0){ o.nuts++; o.regrow=REGROW; } }
    if(o.type==='bush_empty'){ o.regrow=(o.regrow??REGROW)-dt; if(o.regrow<=0){ o.type='bush_berry'; o.regrow=undefined; } }
  }
}
function faint(){                                // 쓰러지면 처음 해변에서 깨어남 (가방은 그대로)
  st.hp=30; st.food=Math.max(st.food,25); st.water=Math.max(st.water,25); warned={};
  enterMap('beachA', MAPS.beachA.start[0], MAPS.beachA.start[1]); hint('쓰러졌어요… 처음 해변에서 정신을 차렸어요',3);
}

// ---------- 그림자: 진회색 38%, 3px 계단, 흐림 없음 ----------
const shadowCache={};
function shadowSprite(w,h,box){
  const k=w+'x'+h+(box?'b':''); if(shadowCache[k]) return shadowCache[k];
  const cw=Math.max(1,Math.round(w/3)), chh=Math.max(1,Math.round(h/3));
  const c=document.createElement('canvas'); c.width=cw; c.height=chh; const g=c.getContext('2d');
  const id=g.createImageData(cw,chh), rx=cw/2, ry=chh/2;
  for(let y=0;y<chh;y++) for(let x=0;x<cw;x++){
    const dx=(x+.5-rx)/rx, dy=(y+.5-ry)/ry;
    const corner=(x===0||x===cw-1)&&(y===0||y===chh-1);              // 네모: 모서리 한 칸만 깎음
    if(box ? !corner : dx*dx+dy*dy<=1){ const i=(y*cw+x)*4; id.data[i]=0x26; id.data[i+1]=0x26; id.data[i+2]=0x2E; id.data[i+3]=255; }
  }
  g.putImageData(id,0,0); return shadowCache[k]=c;
}
function drawShadow(cx,cy,w,box){
  w=Math.max(9,Math.round(w/3)*3); const h=Math.max(6,Math.round(w*(box?0.27:0.3)/3)*3);
  ctx.save(); ctx.imageSmoothingEnabled=false; ctx.globalAlpha=.38;
  ctx.drawImage(shadowSprite(w,h,box), Math.round(cx-w/2+(box?5:0)), Math.round(cy-h*(box?0.62:0.6)), w, h);

const sprOf=o=>(o.type==='palm'&&o.spr)?o.spr:o.type;
function shadowWidth(o){ const m=OB[sprOf(o)]; if(o.type==='tree') return m[2]/K*0.5; if(o.type==='palm') return m[2]/K*0.42; if(o.type==='crate') return m[2]/K*1.02; return m[6]/K*1.05; }   // 상자: 몸 너비 전체

// ---------- 가까이 가면 동작 ----------
const st={walkDist:0,x:640,y:300,dir:'down',moving:false,t:0,act:null,actT:0,hit:false,wood:0,depth:0,target:null,blocked:0,inv:{},hp:100,food:70,water:60};
const REACH=44;
function reachDist(o){ const s=SOLID[o.type]||[10,6]; const dx=(st.x-o.x)/(s[0]+REACH), dy=(st.y-o.y)/(s[1]+REACH*0.8); return Math.hypot(dx,dy); }
function canAct(o){ return !!actionOf(o); }
function findTarget(){ let best=null, bd=1; for(const o of objs){ if(!canAct(o)) continue; const d=reachDist(o); if(d<bd){ bd=d; best=o; } } return best; }
function faceTo(o){ const vx=o.x-st.x, vy=(o.y-st.y)*1.6; st.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up'); }
function doAction(){
  if(gameScreen.hidden||!menu.hidden||bagOpen()||st.act) return;
  const t=st.target;
  if(!t){ hint('가까이 가면 버튼이 켜져요',1.4); return; }
  faceTo(t); st.act=actionOf(t).anim; st.actT=0; st.hit=false; st.actObj=t; st.appT=0;
  if(st.act==='pick' && PICK[t.type]){         // 손이 물건에 닿는 자리로 한두 걸음 다가감 (옆: 손이 발보다 20px 앞)
    const dx={left:-1,right:1}[st.dir]||0;
    const to = dx ? [t.x-dx*20, t.y+2] : st.dir==='down' ? [t.x, t.y-6] : [t.x, t.y+6];
    const d=Math.hypot(to[0]-st.x,to[1]-st.y);
    if(d>2 && walkable(to[0],to[1])){ st.from=[st.x,st.y]; st.to=to; st.appT=Math.min(.22,d/200); }
  }
  if(st.act==='shake'){                      // 줄기 옆으로 가서 두 손으로 잡고 흔듦 (주먹이 줄기에 닿는 자리)
    const side=st.x<t.x?-1:1; st.side=side; st.dir=side<0?'right':'left';
    const tr=BEACH.trunk[sprOf(t)]||[-9,8];      // 손 높이에서 줄기 왼쪽·오른쪽 끝
    st.from=[st.x,st.y]; st.to=side<0?[t.x+tr[0]-27,t.y+4]:[t.x+tr[1]+27,t.y+4];
  }
}
const TIMES={chop:[.14,.24,.46], pick:[.16,.30,.48], shake:[.16,.55,.95]};   // [장면 바뀜, 효과, 끝]
function hitNow(t){
  if(!t || !objs.includes(t) || reachDist(t)>=1.15) return;
  if(st.act==='chop' && t.type==='tree'){
    t.shake=.25; t.hp--; give('wood',1,t.x,t.y-120);
    if(t.hp<=0){ t.type='stump'; hint('나무를 다 베었어요!',1.6); }
  } else if(st.act==='shake' && t.type==='tree' && t.branches>0){
    t.shake=.45; t.branches--;
    const side=-(st.side||1), nx=t.x+side*(30+Math.random()*14), ny=t.y+16+Math.random()*10;
    objs.push({type:'branch',x:nx,y:ny,fall:.45,shake:0});
    if(t.branches===0) hint('가지가 더 안 떨어져요',1.6);
  } else if(st.act==='shake' && t.type==='palm' && t.nuts>0){
    t.shake=.45; t.nuts--;
    // 코코넛이 야자수 발밑 옆으로 떨어짐 (사람 쪽)
    const side=-(st.side||1), nx=t.x+side*(28+Math.random()*12), ny=t.y+14+Math.random()*10;   // 사람 반대쪽에 떨어짐
    objs.push({type:'coconut',x:nx,y:ny,fall:.45,shake:0});
    if(t.nuts===0) hint('코코넛이 다 떨어졌어요',1.6); t.regrow=REGROW;
  } else if(st.act==='pick'){
    if(t.type==='bush_berry'){ if(!roomFor('berries',3)){ hint('가방의 음식 칸이 꽉 찼어요',1.8); return; } t.type='bush_empty'; t.regrow=REGROW; t.shake=.2; give('berries',3,t.x,t.y-70); }
    else if(PICK[t.type]){ const [item,n]=PICK[t.type]; if(!roomFor(item,n)){ hint('가방의 음식 칸이 꽉 찼어요',1.8); return; } objs.splice(objs.indexOf(t),1); give(item,n,t.x,t.y-40); }
  }
}

// ---------- 갱신 ----------
const pops=[];
const hintEl=document.getElementById('hint'); let hintMsg=null, hintLock=0;
function hint(m,lock){ if(hintLock>0&&!lock) return; if(lock) hintLock=lock; if(m!==hintMsg){ hintMsg=m; hintEl.textContent=m; } }
const SPEED=150, WATER_SLOW=.55;   // v17: 120 → 150
const cam={x:0,y:0}; let camInit=false;
function clampCam(){ cam.x=Math.min(Math.max(cam.x,0),Math.max(0,WORLD.w-VW)); cam.y=Math.min(Math.max(cam.y,0),Math.max(0,WORLD.h-VH)); }
function walkable(x,y){
  if(x<14||x>WORLD.w-14||y<90||y>WORLD.h-4) return false;
  if(BLOCK(zoneAt(x,y))||BLOCK(zoneAt(x-10,y))||BLOCK(zoneAt(x+10,y))) return false;
  for(const o of objs){ const s=SOLID[o.type]; if(!s) continue; const dx=(x-o.x)/s[0], dy=(y-o.y)/s[1]; if(dx*dx+dy*dy<1) return false; }
  return true;
}
let lastAct=null;
function update(dt){
  st.t+=dt; hintLock=Math.max(0,hintLock-dt); fadeT=Math.max(0,fadeT-dt); st.blocked=Math.max(0,st.blocked-dt);
  let vx=jv[0]+((keys.arrowright||keys.d)?1:0)-((keys.arrowleft||keys.a)?1:0);
  let vy=jv[1]+((keys.arrowdown||keys.s)?1:0)-((keys.arrowup||keys.w)?1:0);
  const m=Math.hypot(vx,vy); st.moving=false;
  const zone=zoneAt(st.x,st.y);
  if(st.act){
    const T=TIMES[st.act]; st.actT+=dt;
    if(st.act==='pick' && st.appT>0){ const k=Math.min(1,st.actT/st.appT); st.x=st.from[0]+(st.to[0]-st.from[0])*k; st.y=st.from[1]+(st.to[1]-st.from[1])*k; }
    const lt=st.actT-(st.appT||0);   // 다가간 뒤부터 잰 시간
    if(st.act==='shake' && st.actT>T[0] && st.actObj) st.actObj.shake=Math.max(st.actObj.shake,.12);   // 잡고 있는 동안 계속 흔들림
    if(st.act==='shake' && st.to){ const k=Math.min(1,st.actT/T[0]); const nx=st.from[0]+(st.to[0]-st.from[0])*k, ny=st.from[1]+(st.to[1]-st.from[1])*k; if(walkable(nx,ny)){ st.x=nx; st.y=ny; } }
    if(!st.hit && lt>=T[1]){ st.hit=true; hitNow(st.actObj); }
    if(lt>=T[2]) st.act=null;
  } else if(m>0.2 && menu.hidden){
    if(m>1){vx/=m;vy/=m;}
    st.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');
    st.moving=true;
    const sp=SPEED*(st.depth>12?WATER_SLOW:1)*dt;
    const nx=st.x+vx*sp, ny=st.y+vy*sp;
    const ox0=st.x, oy0=st.y;
    const ex=exitAt(nx);
    if(ex){ enterMap(ex[0], ex[1], st.y); return; }
    if(walkable(nx,ny)){ st.x=nx; st.y=ny; }
    else if(Math.abs(vx)>.15 && walkable(nx,st.y)) st.x=nx;
    else if(Math.abs(vy)>.15 && walkable(st.x,ny)) st.y=ny;
    else st.blocked=.3;
    st.walkDist+=Math.hypot(st.x-ox0,st.y-oy0);
    if(st.blocked>0 && (zoneAt(nx,ny)===4||zoneAt(nx+vx*12,ny+vy*12)===4)) hint('더 깊은 곳은 못 들어가요',1.2);
    else if(st.blocked>0){ const n=noteAt(nx+vx*12,ny+vy*12); if(n) hint(n,1.6); }
  }
  // 덤불: 지나가면 흔들리고 잎이 튐
  for(const o of objs){ if(!BUSH[o.type]) continue; const bx=(st.x-o.x)/40, by=(st.y-o.y)/14, inside=bx*bx+by*by<1;
    if(inside && !o.inside && st.moving){ o.shake=.3; for(let i=0;i<3;i++) leaves.push({x:o.x+(Math.random()-.5)*50,y:o.y-28-Math.random()*20,vx:(Math.random()-.5)*70,vy:-50-Math.random()*40,t:0,c:i%2}); }
    o.inside=inside; }
  leaves.forEach(l=>{ l.t+=dt; l.x+=l.vx*dt; l.y+=l.vy*dt; l.vy+=170*dt; }); leaves=leaves.filter(l=>l.t<.7);
  updateCrabs(dt);
  const wantDepth=waterDepth(st.x,st.y); st.depth+=(wantDepth-st.depth)*Math.min(1,dt*12);
  const t=findTarget(); st.target=t;
  const a=t?actionOf(t):null, key=a?a.label+a.icon:'';
  if(key!==lastAct){ lastAct=key; actBtn.classList.toggle('on',!!a); actLabel.textContent=a?a.label:''; if(a) actIcon.className='ic '+a.icon;
    actBtn.setAttribute('aria-label',a?a.label:'행동(가까이 가면 켜짐)'); }
  if(!st.act && actHeld && t) doAction();
  if(!st.act){
    if(t) hint(NAME[t.type]||'');
    else if(st.depth>12) hint('얕은 물: 천천히 걸어요');
    else hint(st.moving||st.t>8?'':'가까이 가면 오른쪽 버튼이 켜져요');
  }
  objs.forEach(o=>{ o.shake=Math.max(0,o.shake-dt); if(o.fall>0) o.fall=Math.max(0,o.fall-dt); });
  pops.forEach(p=>p.t+=dt); while(pops.length&&pops[0].t>1) pops.shift();
  // 카메라: 캐릭터를 가운데보다 조금 위에 (아래 조작을 피함)
  const tx=st.x-VW/2, ty=st.y-60-VH/2+VH*0.06;
  if(camInit){ cam.x=tx; cam.y=ty; camInit=false; } else { const k=Math.min(1,dt*7); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; }
  clampCam();
}

// ---------- 게: 물가를 옆으로 걷다가 다가가면 달아남 ----------
function crabOk(x,y){ const z=zoneAt(x,y); return z>=1 && z<=3 && x>20 && x<WORLD.w-20; }   // 게는 지도를 안 넘어감
function updateCrabs(dt){
  for(const c of crabs){
    if(Math.hypot(st.x-c.x,(st.y-c.y)*1.4)<95){ c.mode='flee'; c.timer=.9; c.dir=st.x<c.x?1:-1; }
    c.timer-=dt;
    if(c.timer<=0){
      if(c.mode==='idle'){ c.mode='walk'; c.timer=.8+Math.random()*1.4; const back=c.x-c.hx; c.dir=Math.abs(back)>70?(back>0?-1:1):(Math.random()<.5?-1:1); }
      else { c.mode='idle'; c.timer=1+Math.random()*2; }
    }
    const sp=c.mode==='flee'?115:c.mode==='walk'?38:0;
    if(sp){ const nx=c.x+c.dir*sp*dt; if(crabOk(nx,c.y)){ c.dist+=Math.abs(nx-c.x); c.x=nx; } else c.dir*=-1; }
    c.f=sp?Math.floor(c.dist/4)%4:0;
  }
}
function drawCrab(c){ const [sx,sy,sw,sh,fx,fy]=OB['crab'+c.f]; ctx.drawImage(IMG.objs,sx,sy,sw,sh,c.x-fx/K,c.y-fy/K,sw/K,sh/K); }

// ---------- 그리기 ----------
function drawRipples(x,y){
  ctx.save(); ctx.lineWidth=2;
  for(let i=0;i<2;i++){
    const p=((st.t*0.6)+i*0.5)%1;
    ctx.globalAlpha=(1-p)*0.75; ctx.strokeStyle='#eafff8';
    ctx.beginPath(); ctx.ellipse(x,y,16+p*18,4+p*5,0,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=.55; ctx.fillStyle='#d8fbf2'; ctx.beginPath(); ctx.ellipse(x,y,15,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  let anim,i,ox=0;
  const T=st.act?TIMES[st.act]:null;
  if(st.act==='chop'){ anim='chop'; i=st.actT<T[0]?0:st.actT<T[1]?1:2; }
  else if(st.act==='pick'){ const lt=st.actT-(st.appT||0); if(lt<0){ anim='walk'; i=Math.floor(st.t*10); } else { anim='pick'; i=lt<T[0]?0:1; } }
  else if(st.act==='shake'){ if(st.actT<T[0]){ anim='walk'; i=Math.floor(st.t*8); } else { anim='shake'; const SEQ=[0,1,2,1,2,3]; i=SEQ[Math.min(5,Math.floor((st.actT-T[0])/(T[2]-T[0])*6))]; } }   // 섬→당기기→밀기→당기기→밀기→섬
  else if(st.moving){ anim='walk'; const side=st.dir==='left'||st.dir==='right'; i=Math.floor(st.walkDist/(side?24:15)); }   // 걸은 거리로 장면을 바꿈 → 발이 미끄러지지 않음 (옆모습은 보폭이 커서 24px마다)
  else { anim='stand'; i=0; }
  const [name,flip]=sprite(st.dir,anim);
  const d=Math.round(st.depth);
  if(d>1){
    ctx.save(); ctx.beginPath(); ctx.rect(st.x-200,st.y-400,400,400-d); ctx.clip();
    drawFrame(ctx,chosen,name,i,st.x+ox,st.y,112,flip); ctx.restore();
    if(d>KNEE*0.6) drawRipples(st.x,st.y-d);
  } else drawFrame(ctx,chosen,name,i,st.x+ox,st.y,112,flip);
}
function inView(o){ const m=OB[sprOf(o)]; const w=m[2]/K, h=m[3]/K; return o.x+w>cam.x && o.x-w<cam.x+VW && o.y>cam.y-20 && o.y-h-160<cam.y+VH; }
function drawWorld(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=Math.round(cam.x*dpr)/dpr, cy=Math.round(cam.y*dpr)/dpr;
  ctx.imageSmoothingEnabled=false;
  const fl=IMG['floor_'+cur]; if(fl.complete) ctx.drawImage(fl, cx,cy,VW,VH, 0,0,VW,VH);
  ctx.translate(-cx,-cy);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  const vis=objs.filter(inView);
  vis.forEach(o=>{ if(zoneAt(o.x,o.y)<3 && !(o.fall>.15)) drawShadow(o.x,o.y,shadowWidth(o),o.type==='crate'); });
  crabs.forEach(c=>drawShadow(c.x,c.y,22));   // 떨어지는 코코넛은 땅에 닿을 때쯤 그림자
  if(st.depth<5) drawShadow(st.x,st.y,36);
  if(st.target && !st.act){
    const s=SOLID[st.target.type]||[12,6], p=(Math.sin(st.t*6)+1)/2;
    ctx.save(); ctx.globalAlpha=.55+p*.4; ctx.strokeStyle='#F2C14E'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(st.target.x,st.target.y,s[0]+10+p*3,s[1]+6+p*2,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  const items=vis.map(o=>({y:o.y,draw:()=>drawObj(o)}));
  items.push({y:st.y,draw:drawPlayer});
  crabs.forEach(c=>{ if(c.x>cam.x-40&&c.x<cam.x+VW+40&&c.y>cam.y-20&&c.y<cam.y+VH+40) items.push({y:c.y,draw:()=>drawCrab(c)}); });
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.draw());
  leaves.forEach(l=>{ ctx.globalAlpha=Math.max(0,1-l.t/.7); ctx.fillStyle=l.c?'#7cb342':'#4a8a2a'; ctx.fillRect(Math.round(l.x),Math.round(l.y),4,3); }); ctx.globalAlpha=1;
  ctx.font='16px Jua, sans-serif'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.lineJoin='round';
  pops.forEach(p=>{ const y=p.y-p.t*24; ctx.globalAlpha=Math.max(0,1-p.t); ctx.strokeStyle='#1d1a12'; ctx.strokeText(p.text,p.x,y); ctx.fillStyle='#fff8ea'; ctx.fillText(p.text,p.x,y); });
  ctx.globalAlpha=1;
  fadeEl.style.opacity=fadeT>0?(fadeT/FADE).toFixed(2):'0';   // 지도 넘어갈 때 잠깐 어두워졌다 밝아짐
}
const fadeEl=document.getElementById('fade');

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);                     // 먼저 다음 장면을 예약 (한 장면에서 오류가 나도 게임이 멈추지 않음)
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  if(gameScreen.hidden) drawPick(now/1000); else { if(menu.hidden&&!bagOpen()){ update(dt); survive(dt); renderGauges(); } drawWorld(); }
}
requestAnimationFrame(loop);

  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded||!hadController) return; reloaded=true; location.reload(); });

try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// 새 버전 안내 창: 처음 들어온 사람에게는 안 띄움
(function notice(){
  const seen=store.get('seenV');
  if(!seen){ store.set('seenV',APP_V); return; }
  if(seen!==APP_V && NOTE){
    document.getElementById('noticeTitle').textContent='v'+APP_V+'에서 바뀐 점';
    document.getElementById('noticeText').textContent=NOTE;
    document.getElementById('noticeBox').hidden=false;
  }
})();
document.getElementById('noticeOk').addEventListener('click',()=>{ store.set('seenV',APP_V); document.getElementById('noticeBox').hidden=true; });

// 업데이트 확인 (다른 앱의 version.json이면 무시)
const band=document.getElementById('updBand'); let lastCheck=0, bandClosed=false;
async function checkUpdate(){
  if(!web||bandClosed) return; lastCheck=Date.now();
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(j.app===APP && String(j.v)!==APP_V) band.hidden=false;
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && Date.now()-lastCheck>600000) checkUpdate(); });
document.getElementById('updX').addEventListener('click',()=>{ band.hidden=true; bandClosed=true; });
document.getElementById('updBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('updBtn'); btn.disabled=true; btn.textContent='바꾸는 중';
  try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; }
  catch(e){ btn.disabled=false; btn.textContent='바꾸기'; band.querySelector('span').textContent='인터넷이 연결되면 다시 눌러 주세요'; return; }
  // 저장소에 다른 앱 화면이 잘못 올라가 있으면 바꾸지 않음 (지금 판을 그대로 지킴)
  try{ const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'}); const head=(await r.text()).slice(0,600);
    if(!r.ok||!head.includes('content="'+APP+'"')) throw 0; }
  catch(e){ btn.hidden=true; band.querySelector('span').textContent='올라간 파일이 표류섬 것이 아니에요. 지금 판을 그대로 쓸게요.'; return; }
  try{ const snap={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(APP+':')&&!k.endsWith('before-update')) snap[k]=localStorage.getItem(k); } store.set('before-update',JSON.stringify({at:Date.now(),v:APP_V,data:snap})); }catch(e){}
  try{ const ks=await caches.keys(); await Promise.all(ks.filter(k=>k.startsWith(APP+'-')).map(k=>caches.delete(k))); }catch(e){}
  try{ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.filter(r=>r.scope===myScope).map(r=>r.unregister())); }catch(e){}
  try{ await Promise.all(['./','index.html','sw-castaway-isle.js','manifest.webmanifest'].map(f=>fetch(f,{cache:'reload'}))); }catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
});

// 설치
const ua=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inApp=/KAKAOTALK|NAVER|Instagram|BAND|FBAN|FBAV|Line\//i.test(ua)||(isIOS&&/CriOS/.test(ua));
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let bip=null; const bipWait=Date.now();
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); bip=e; });
addEventListener('appinstalled',()=>{ bip=null; installMsg('설치했어요. 이 창은 닫고 홈 화면의 표류섬 아이콘으로 열어 주세요.'); });
const installBtn=document.getElementById('installBtn');
if(standalone) installBtn.hidden=true;
function installMsg(t){ const p=document.getElementById('installMsg'); p.textContent=t; p.hidden=false; }
installBtn.addEventListener('click',async()=>{
  if(inApp){ installMsg(isIOS?'이 앱 안에서는 설치가 안 돼요. 공유(또는 ⋯) → "Safari로 열기"를 눌러 주세요.':'이 앱 안에서는 설치가 안 돼요. 오른쪽 위 점 세 개 → "다른 브라우저로 열기"를 눌러 주세요.'); return; }
  if(isIOS){ installMsg('Safari 공유 버튼(네모에 위 화살표, 안 보이면 ⋯ 안) → 목록을 위로 올려 "홈 화면에 추가"를 눌러 주세요.'); return; }
  if(bip){ bip.prompt(); const r=await bip.userChoice; bip=null; if(r.outcome==='accepted') installMsg('설치했어요. 홈 화면의 표류섬 아이콘으로 열어 주세요.'); return; }
  if(Date.now()-bipWait<8000) installMsg('설치 준비 중이에요. 몇 초 뒤에 다시 눌러 주세요.');
  else installMsg('크롬 오른쪽 위 점 세 개(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요. 삼성 인터넷은 아래 메뉴 → 현재 페이지 추가 → 홈 화면.');
});
// 카톡 등 앱 안 브라우저 안내
if(inApp && web){
  const ib=document.getElementById('inappBand'); ib.hidden=false;
  const btn=document.getElementById('inappBtn');
  if(isIOS){ document.getElementById('inappText').textContent='이 앱 안에서는 설치가 안 돼요. 공유 → "Safari로 열기"를 눌러 주세요.'; btn.hidden=true; }
  else btn.addEventListener('click',()=>{ location.href='intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end'; setTimeout(()=>{ document.getElementById('inappText').textContent='안 열리면 오른쪽 위 점 세 개 → "다른 브라우저로 열기"를 눌러 주세요.'; },1500); });
}

window.__st=st; window.__objs=()=>objs; window.__crabs=()=>crabs; window.__loaded=()=>loaded; window.__cam=cam; window.__zoneAt=(x,y)=>zoneAt(x,y);
window.__map=()=>cur; window.__survive=sec=>{ for(let i=0;i<sec*10;i++) survive(.1); renderGauges(); }; window.__bagOpen=bagOpen; window.__go=(k,x,y)=>enterMap(k,x,y,true); window.__walkable=(x,y)=>walkable(x,y);
})();
