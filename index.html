  :root{--ink:#FFF6E2;--sub:#D7DCE8;--gold:#F2C14E;--red:#D9452F;--redD:#8E2416;--glass:rgba(16,22,34,.58);--rim:rgba(255,246,226,.38)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12202b;color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
  [hidden]{display:none!important}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
  .jua{font-family:'Jua',system-ui,sans-serif;font-weight:400}
  .ic{display:inline-block;width:24px;height:24px;background:url(ui_icons.webp) no-repeat;background-size:400% 300%;flex-shrink:0}
  .ic.wood{background-position:0 0}.ic.coconut{background-position:33.333% 0}.ic.stone{background-position:66.667% 0}.ic.vine{background-position:100% 0}
  .ic.shell{background-position:0 50%}.ic.berries{background-position:33.333% 50%}.ic.axe{background-position:66.667% 50%}.ic.palm{background-position:100% 50%}
  .ic.branch{background-position:0 100%}
  .craft{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 1.5rem);z-index:5;
    display:flex;align-items:center;gap:.5rem;background:rgba(40,30,12,.82);border:1.5px solid var(--gold);border-radius:999px;padding:.25rem .25rem .25rem .75rem;font-size:.9375rem;font-weight:600;
    box-shadow:0 0 14px rgba(242,193,78,.35);animation:pop .4s}
  .craft .ic{width:28px;height:28px}
  .craft button{min-height:40px;border:none;border-radius:999px;background:var(--gold);color:#3a2608;font-weight:700;padding:0 .875rem;cursor:pointer;flex-shrink:0}
  .craft .x{background:transparent;color:var(--ink);padding:0 .5rem;font-size:1.125rem}

  /* ---------- 첫 화면 ---------- */
  #selectScreen{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(10,20,30,.2),rgba(10,20,30,.85) 72%),url(title_ship.webp) 50% 30%/cover no-repeat #0b1626;
    padding:calc(env(safe-area-inset-top) + 2rem) 1rem calc(env(safe-area-inset-bottom) + 1.5rem)}
  .sel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:1rem}
  .logo{text-align:center;font-size:3.25rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 #6b3d12,0 0 18px rgba(0,0,0,.45);letter-spacing:.04em;margin:0}
  .tag{text-align:center;color:var(--ink);font-size:.9375rem;margin:.375rem 0 0;word-break:keep-all;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-top:.5rem}
  .who{background:rgba(16,22,34,.55);border:2px solid var(--rim);border-radius:1.125rem;padding:.625rem .5rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer;min-width:0}
  .who[aria-pressed="true"]{border-color:var(--gold);background:rgba(60,44,16,.62);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
  .who canvas{width:100%;max-width:140px;aspect-ratio:3/4}
  .who b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.375rem}
  .who span{font-size:.8125rem;color:var(--sub);text-align:center;line-height:1.4}
  .note{text-align:center;color:var(--sub);font-size:.8125rem;line-height:1.5;margin:0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .start{min-height:3.5rem;border:3px solid var(--gold);border-radius:1rem;background:var(--red);color:#fff;font-family:'Jua',sans-serif;font-size:1.5rem;box-shadow:0 5px 0 var(--redD);cursor:pointer}
  .start:active{transform:translateY(4px);box-shadow:0 1px 0 var(--redD)}
  .ver{text-align:center;font-size:.75rem;color:rgba(255,246,226,.55);margin:0}

  /* ---------- 게임: 그림 위에 모든 조작 ---------- */
  #gameScreen{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#29a8a8;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  #world{position:absolute;left:0;top:0;display:block}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:.5rem;padding:calc(env(safe-area-inset-top) + .625rem) .625rem 0;pointer-events:none}
  .inv{display:flex;flex-wrap:wrap;gap:.25rem;min-width:0;flex:1}
  .res{display:flex;align-items:center;gap:.125rem;background:rgba(10,16,26,.42);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:1px .5rem 1px 2px;font-size:.9375rem;line-height:1.6;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .res.pop{animation:pop .35s}
  @keyframes pop{40%{transform:scale(1.18)}}
  /* 생존 수치: 왼쪽 위 막대 3개 */
  .gauges{display:flex;flex-direction:column;gap:5px;background:rgba(10,16,26,.42);border:1px solid rgba(255,255,255,.16);border-radius:.75rem;padding:6px 8px 6px 6px;pointer-events:none}
  .g{display:flex;align-items:center;gap:5px}

<script>
(() => {
'use strict';
const APP='castaway-isle', APP_V='50', NOTE="게가 바다로 안 들어가요. PC에서 엔터로 행동, 메뉴에 '정글로 바로 가기 · 테스트'";
const KEY = n => APP+':'+n;                         // 이 앱의 저장 이름 (다른 앱과 안 겹침)
const store = {get:k=>{try{return localStorage.getItem(KEY(k));}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(KEY(k),v);}catch(e){}}};
const vibrationBtn=document.getElementById('vibrationBtn');
const beachAudio=createBeachAudio(store,document.getElementById('soundSettings'));
const canVibrate=typeof navigator.vibrate==='function';
let vibrationOn=store.get('vibration')!=='off';
function pulse(pattern){
  if(!canVibrate||!vibrationOn||document.hidden)return;
  navigator.vibrate(pattern);
}
function refreshVibrationButton(){
  vibrationBtn.hidden=!canVibrate;
  vibrationBtn.textContent=vibrationOn?'진동 켜짐':'진동 꺼짐';
  vibrationBtn.setAttribute('aria-pressed',String(vibrationOn));
}
vibrationBtn.addEventListener('click',()=>{
  if(!canVibrate)return;
  vibrationOn=!vibrationOn;
  if(!vibrationOn)navigator.vibrate(0);
  store.set('vibration',vibrationOn?'on':'off');
  refreshVibrationButton();

const FRAME_SIZE_FIX={girl:{walk_side:[1.020,1.027,0.976,0.981]}};
function drawFrame(c, ch, anim, i, x, y, h, flip){
  const list = FRAMES[ch][anim]; if(!list) return;
  const f=list[i%list.length], key=f[6]?ch+'_'+f[6]:ch;
  const im=IMG[key], factor=sheetScale(im,heroSheets[key],true);
  if(!factor)return;
  const [sx,sy,sw,sh,ax,ay]=f, s=h/SRC_H*((FRAMES[ch]._fix||{})[anim]||1)*((FRAME_SIZE_FIX[ch]?.[anim]||[])[i%list.length]||1);   // 줍기 그림은 크게 그려져 있어 줄임
  const paint=(sx,sy,sw,sh,dx,dy,dw,dh)=>{
    const left=sx*factor, top=sy*factor;
    const srcW=Math.min(sw*factor, im.naturalWidth-left), srcH=Math.min(sh*factor, im.naturalHeight-top);
    if(srcW<=0 || srcH<=0) return;
    c.drawImage(im,left,top,srcW,srcH,dx,dy,dw*srcW/(sw*factor),dh*srcH/(sh*factor));
  };
  c.save(); c.translate(x,y); if(flip) c.scale(-1,1);
  if(anim==='fish_side'&&ch==='girl'){
    const cut=fishingRodArt.girl.cuts[i];
    c.beginPath();c.rect(-ax*s,-ay*s,sw*s,sh*s);
    cut.forEach(([px,py],index)=>c[index?'lineTo':'moveTo']((px-ax)*s,(py-ay)*s));
    c.closePath();c.clip('evenodd');
    paint(sx,sy,sw,sh,-ax*s,-ay*s,sw*s,sh*s);
  }else if(anim==='fish_side'&&i!==1){
    const cut=i===0?[[166,0],[185,0],[185,67],[102,67],[104,53],[170,19],[170,5]]:
      [[129,7],[153,7],[153,46],[139,46],[125,9]];
    c.beginPath();c.rect(-ax*s,-ay*s,sw*s,sh*s);
    cut.forEach(([px,py],index)=>c[index?'lineTo':'moveTo']((px-ax)*s,(py-ay)*s));
    c.closePath();c.clip('evenodd');
    paint(sx,sy,sw,sh,-ax*s,-ay*s,sw*s,sh*s);
  }else if(anim==='fish_side'&&i===1){
    const [maskX,maskY]=fishingRodArt[ch].oldLine;
    paint(sx,sy,sw,maskY,-ax*s,-ay*s,sw*s,maskY*s);
    paint(sx,sy+maskY,maskX,sh-maskY,-ax*s,(maskY-ay)*s,maskX*s,(sh-maskY)*s);
  }else paint(sx,sy,sw,sh,-ax*s,-ay*s,sw*s,sh*s);
  c.restore();
}

    if(action!==undefined) return action;
  }
  if(o.gateRock) return {label:'돌무더기 치우기',icon:'stone',anim:'pick'};

function renderQuests(title,detail,recipeId){
  const optional=waking||story.gateOpen?[]:BEACH_OPTIONAL_QUESTS
    .filter(quest=>quest.when(detail)).map(quest=>[quest.title,quest.detail,quest.recipe]);
  const entries=[[title,detail,recipeId],...optional].map(([name,help,id],i)=>{
    const recipe=RECIPES.find(r=>r.id===id);
    const needs=recipe?materials(recipe.need):'';
    const description=needs&&help!==needs?[needs,help].filter(Boolean).join(' · '):help;
    return {name,help,description,recipe,main:i===0,ready:!!recipe&&canCraft(recipe)};
  });
  const ready=entries.filter(q=>q.ready);
  const pending=entries.filter(q=>!q.ready);
  const hiddenCount=pending.filter(q=>!q.main).length;
  if(!hiddenCount)questsExpanded=false;
  const visible=[...ready,...(questsExpanded?pending:pending.filter(q=>q.main))];
  if(!questsExpanded||!pending.some(q=>q.name===selectedQuest))selectedQuest=null;
  const key=JSON.stringify([visible,hiddenCount,questsExpanded,selectedQuest]);
  if(lastQuestDisplay===key)return;
  lastQuestDisplay=key;
  questList.replaceChildren(...visible.map(({name,help,description,recipe,main,ready},i)=>{
    const row=document.createElement('li');
    const label=document.createElement(ready?'span':'button');
    label.className=ready?'questName':'questTask';label.textContent=name;
    const selected=selectedQuest===name;
    const showDetails=ready||selected||(!questsExpanded&&main);
    if(!ready){
      label.type='button';
      if(description)label.setAttribute('aria-expanded',String(showDetails));
      if(selected)label.classList.add('is-open');
      label.addEventListener('click',()=>{
        if(waking||dialoguePinned||sleepScene||hutTransition||discovery||!menu.hidden)return;
        if(!questsExpanded){if(help)hint(help,2.8);return;}
        if(!description)return;
        selectedQuest=selected?null:name;goal();
        const current=questList.children[i];
        current?.firstElementChild?.focus?.({preventScroll:true});
        if(selectedQuest)current?.scrollIntoView?.({block:'nearest'});
      });
    }
    row.appendChild(label);
    if(description&&showDetails){
      const text=document.createElement('small');text.textContent=description;row.appendChild(text);
    }
    if(ready){
      const button=document.createElement('button');button.type='button';button.className='questCraft';
      button.textContent=BEACH_CRAFT_LABELS[recipe.id];
      button.addEventListener('click',()=>craft(recipe));row.appendChild(button);
    }
    return row;
  }));
  questBoxEl.classList.toggle('is-expanded',questsExpanded);
  questMore.dataset.available=String(hiddenCount>0);
  questMore.hidden=questScroll.hidden||!hiddenCount;
  questMore.textContent=questsExpanded?'추가 접기 ▴':`더보기 +${hiddenCount} ▾`;
  questMore.setAttribute('aria-expanded',String(questsExpanded));
}

    const recipeItems=craftRecipe?Object.keys(craftRecipe.need):[];

    for(const item of new Set([...items,...recipeItems])){
      if(!Object.hasOwn(ITEM_DB,item)) console.error('해변 퀘스트에 정의되지 않은 아이템:',id,item);
    }
    const recipeObjects=craftRecipe?.structure?[craftRecipe.id]:[];
    for(const type of new Set([...objects,...recipeObjects])){
      if(!hasAction(type)) console.error('해변 퀘스트에 동작이 정의되지 않은 물체:',id,type);

function canPlace(type,x,y){
  if(coversSos(type,x,y)||(cur==='beachB'&&inTidalPath(x,y)))return false;
  const [w,h]=SOLID[type];
  if(Math.hypot(x-st.x,y-st.y)>165||Math.abs(x-st.x)<w+6&&Math.abs(y-st.y)<h+5) return false;
  if((MAP.exits||[]).some(e=>e.side==='left'?x-w<44:x+w>WORLD.w-44)) return false;
  for(const ox of [-w,0,w]) for(const oy of [-h,0,h]){
    if(zoneAt(x+ox,y+oy)>1 || !walkable(x+ox,y+oy) || noteAt(x+ox,y+oy)) return false;
  }
  if(objs.some(o=>{
    const [ow,oh]=SOLID[o.type]||[12,8];

function hutFire(hut){
  const [dx,dy]=dirVector[hut.dir||'down'];let best=null,range=Infinity;
  for(const fire of objs){
    if(fire.type!=='fire')continue;
    const x=fire.x-hut.x,y=fire.y-hut.y,forward=x*dx+y*dy,side=-x*dy+y*dx;
    const distance=Math.hypot(x,y);
    if(forward<26||distance>240||Math.abs(side)>Math.max(60,forward*.83)||distance>=range)continue;
    range=distance;best={fire,forward,side};
  }
  return best;
}
function bestHutDirection(x,y){
  let best='down',d=Infinity;
  for(const dir of directions){
    const f=hutFire({x,y,dir});
    if(f&&Math.hypot(f.side,f.forward)<d){best=dir;d=Math.hypot(f.side,f.forward);}
  }
  return best;
}

const st={walkDist:0,stepDistance:0,running:false,x:640,y:300,dir:'down',moving:false,t:0,act:null,actT:0,hit:false,wood:0,depth:0,target:null,blocked:0,inv:{},hp:100,food:70,water:60};
const REACH=44;
function reachDist(o){ const s=SOLID[o.type]||[10,6]; const dx=(st.x-o.x)/(s[0]+REACH), dy=(st.y-o.y)/(s[1]+REACH*0.8); return Math.hypot(dx,dy); }
function canAct(o){ return !!actionOf(o); }
function pickupPath(x,y){
  return [.25,.5,.75,1].every(f=>walkable(st.x+(x-st.x)*f,st.y+(y-st.y)*f));
}
function interactionReach(o){
  if(!PICK[o.type])return reachDist(o);
  if((o.fall||0)>.15)return Infinity;
  const x=o.x-st.x,y=o.y-st.y;
  if(Math.hypot(x,y)<24)return Math.hypot(x/74,y/54);
  const length=Math.hypot(x,y);
  const approach=length>22&&pickupPath(o.x-x*18/length,o.y-y*18/length);
  return approach?Math.hypot(x/74,y/54):Infinity;
}
function nearestPickup(){
  let item=null,distance=Infinity;
  for(const o of objs){
    const pick=PICK[o.type],d=Math.hypot(o.x-st.x,o.y-st.y);
    if(pick&&d<distance&&interactionReach(o)<1&&roomFor(...pick)){item=o;distance=d;}
  }
  return item;
}
function findTarget(){
  let best=null,bd=Infinity;
  for(const o of objs){
    const d=Math.hypot(o.x-st.x,o.y-st.y);
    if(d<bd&&canAct(o)&&interactionReach(o)<1){bd=d;best=o;}
  }
  if(best?.gateRock&&!story.stormOver&&!story.gateSeen){
    const gate=objs.find(o=>o.type==='gate');
    if(gate&&interactionReach(gate)<1)return gate;
  }
  return best||findFishingWater();
}
function faceTo(o){ const vx=o.x-st.x, vy=(o.y-st.y)*1.6; st.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up'); }
function doAction(target=st.target){
  if(gameScreen.hidden||!menu.hidden||bagOpen()||discovery||sleepScene||hutTransition||hutSleepScene||faintScene||cookingScene)return;
  if(dialoguePinned){nextDialogue();return;}
  if(st.act||waking||ignition||buildMotion||insideHut||!campChoices.hidden)return;
  if(fishing){reelFishing();return;}
  if(placement){confirmPlace();return;}
  const t=target;
  if(!t){ hint('가까이 가면 버튼이 켜져요',1.4); return; }
  if(t.type==='fishWater'){startFishing();return;}
  const action=objs.includes(t) && interactionReach(t)<1 ? actionOf(t) : null;
  if(!action) return;
  if(action.camp){ useCamp(t); return; }
  st.running=false;faceTo(t); st.act=action.anim; st.actT=0; st.hit=false; st.actObj=t; st.appT=0;
  if(st.act==='pick' && PICK[t.type]){         // 손이 물건에 닿는 자리로 한두 걸음 다가감 (옆: 손이 발보다 20px 앞)
    const dx={left:-1,right:1}[st.dir]||0;
    const to = dx ? [t.x-dx*20, t.y+2] : st.dir==='down' ? [t.x, t.y-6] : [t.x, t.y+6];
    const d=Math.hypot(to[0]-st.x,to[1]-st.y);
    if(d>2 && pickupPath(to[0],to[1])){ st.from=[st.x,st.y]; st.to=to; st.appT=Math.min(.22,d/200); }

  if(st.act==='shake'){                      // 줄기 옆으로 가서 두 손으로 잡고 흔듦 (주먹이 줄기에 닿는 자리)
    const side=st.x<t.x?-1:1; st.side=side; st.dir=side<0?'right':'left';
    const tr=BEACH.trunk[sprOf(t)]||[-9,8];      // 손 높이에서 줄기 왼쪽·오른쪽 끝

let fishing=null;
const castDirections=[[0,1],[.707,.707],[-.707,.707],[1,0],[-1,0],[.707,-.707],[-.707,-.707],[0,-1]];
function findFishingWater(){
  if(equipped!=='rod'||!inv.rod||placement||fishing||MAP.jungle)return null;
  let best=null;
  for(const [dx,dy] of castDirections){
    let water=null;
    const [fx,fy]=dirVector[st.dir];
    const penalty=25*(1-dx*fx-dy*fy);
    for(let distance=16;distance<=128;distance+=8){
      const x=Math.round(st.x+dx*distance),y=Math.round(st.y+dy*distance);
      if(x<0||x>=WORLD.w||y<0||y>=WORLD.h)break;
      const zone=zoneAt(x,y);
      if(zone===5||zone===6)break;
      if(isWater(zone)&&distance>=48){
        water={type:'fishWater',x,y,zone,distance,score:distance+penalty};break;
      }
    }
    if(water&&(!best||water.score<best.score))best=water;
  }
  if(!best)return null;
  // Shift the float farther out along the same clear shoreline when possible.
  const dx=(best.x-st.x)/best.distance,dy=(best.y-st.y)/best.distance;
  for(let step=0;step<2&&best.distance+8<=128;step++){
    const x=Math.round(best.x+dx*8),y=Math.round(best.y+dy*8);
    if(x<0||x>=WORLD.w||y<0||y>=WORLD.h||!isWater(zoneAt(x,y)))break;
    best={...best,x,y,zone:zoneAt(x,y),distance:best.distance+8};
  }
  return best;
}
function fishInWater(map,zone,target,bait=false,roll=Math.random()){
  if(map==='beachB'&&exposedTide()&&inTidalPath(st.x,st.y)&&st.x>1155&&
      target?.x>=1190&&target.y>=738&&roll<(bait?.74:.34))return 'tideFish';
  return zone===4?'blueFish':map==='beachB'?'stripedFish':'rawFish';
}
function startFishing(){
  const target=findFishingWater();
  if(!target)return;
  const flip=target.x<st.x||(target.x===st.x&&st.dir==='left');
  const front=fishingFacesFront(target,st);
  st.dir=front?'down':flip?'left':'right';st.moving=false;
  const bait=!!(fishingBait&&inv[fishingBait]);
  if(bait){inv[fishingBait]--;fishingBait=null;renderInv();}
  fishing={...target,phase:'cast',left:.34,fish:fishInWater(cur,target.zone,target,bait),
    flip,front};

function drawFishingFloat(){

  const pose=phase==='cast'?0:phase==='reel'?2:1;

  }

  ctx.quadraticCurveTo((floatX+tipX)/2,(floatY+tipY)/2+(bite?4:10)*progress,floatX,floatY);
  ctx.strokeStyle='#fff1c9aa';ctx.lineWidth=2.8;ctx.stroke();

function beachBedSpot(fire){
  const start={x:st.x,y:st.y};
  const points=[];
  for(const y of [-105,-90,-70,-50,42,58,74,89,103]){
    for(const x of [-102,-78,-54,-30,-9,9,30,54,78,102]){
      const range=Math.hypot(x,y);
      if(range<83||range>WARM_RADIUS-1)continue;
      const bed={x:fire.x+x,y:fire.y+y,flip:x<0};
      const body=[-65,-43,-19,6,34,43].flatMap(dx=>[-5,-22].map(dy=>[
        bed.x+(bed.flip?-dx:dx),bed.y+dy
      ]));
      const clear=body.every(([px,py])=>zoneAt(px,py)<3&&walkable(px,py)
        && !(Math.abs(px-fire.x)<51&&py>fire.y-71&&py<fire.y+20));
      if(!clear)continue;
      const steps=Math.max(1,Math.ceil(Math.hypot(bed.x-start.x,bed.y-start.y)/9));
      const path=Array.from({length:steps},(_,i)=>{
        const f=(i+1)/steps;return [start.x+(bed.x-start.x)*f,start.y+(bed.y-start.y)*f];
      });
      if(path.every(([px,py])=>zoneAt(px,py)<3&&walkable(px,py)))
        points.push({...bed,score:Math.hypot(bed.x-start.x,bed.y-start.y)+(y>0?0:12)});
    }
  }
  return points.sort((a,b)=>a.score-b.score)[0]||null;
}

  clampCam();
  if(was<SLEEP_DAWN&&scene.t>=SLEEP_DAWN)advanceBeachRest(true);
  if(scene.t>=SLEEP_DARK&&scene.t<SLEEP_LIGHT){
    const alpha=scene.t<SLEEP_DAWN?(scene.t-SLEEP_DARK)/(SLEEP_DAWN-SLEEP_DARK):
      (SLEEP_LIGHT-scene.t)/(SLEEP_LIGHT-SLEEP_DAWN);
    sceneCurtain.hidden=false;sceneCurtain.style.opacity=String(alpha);
  }else if(was>=SLEEP_DARK||scene.t>=SLEEP_LIGHT){
    sceneCurtain.hidden=true;sceneCurtain.style.opacity='0';
  }
  if(was<4.55&&scene.t>=4.55)beachAudio.effect('wake');
  if(scene.t>=SLEEP_END){
    sleepScene=null;st.moving=false;firstDawnThought();
  }
}
function drawBeachSleeper(scene){
  const t=scene.t;
  const pose=t<.96||t>=5.69?3:t<1.26||t>=5.12?2:t<1.56||t>=4.67?1:0;
  ctx.save();ctx.translate(st.x,st.y);if(scene.bed.flip)ctx.scale(-1,1);
  drawDense(ctx,'wake',pose*192,chosen==='boy'?0:184,192,184,-96,-159,192,184);
  if(t>=1.65&&t<4.88&&IMG.story.naturalWidth){
    const cover=Math.min(1,(t-1.65)/.86);
    const aside=Math.max(0,(t-4.28)/.6);
    for(let i=0;i<3;i++){
      const moved=Math.min(1,Math.max(0,cover*1.35-i*.15));
      if(!moved)continue;
      ctx.save();ctx.globalAlpha=Math.min(1,moved*2)*(1-aside);
      ctx.translate(-47+i*12-25*(1-moved)-18*aside,-16-12*Math.sin(moved*Math.PI));
      ctx.rotate(-.12+(i-1)*.28+(1-moved)*.48);
      ctx.drawImage(IMG.story,0,0,48,48,-21,-17,42,34);
      ctx.restore();
    }
  }
  ctx.restore();
}

let last=performance.now(),nextSoundUpdate=0;
function loop(now){
  requestAnimationFrame(loop);                     // 먼저 다음 장면을 예약 (한 장면에서 오류가 나도 게임이 멈추지 않음)
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  if(gameScreen.hidden){drawPick(now/1000);return;}
  if(hutTransition){tickHutTransition(dt);if(insideHut)drawHutView();else drawWorld();return;}
  if(now>=nextSoundUpdate){
    nextSoundUpdate=now+160;
    const zone=zoneAt(st.x,st.y);
    const fire=objs.reduce((level,o)=>o.type==='fire'&&o.fuel>0?
      Math.max(level,1-Math.hypot(st.x-o.x,st.y-o.y)/160):level,0);
    beachAudio.scene(!document.hidden,isNight(),zone,fire,!!insideHut,!menu.hidden,!!MAP.jungle);
  }
  if(!document.hidden&&menu.hidden&&!bagOpen()&&!discovery){
    if(faintScene){tickFaint(dt);drawWorld();return;}
    if(cookingScene){st.t+=dt;tickCooking(dt);drawWorld();return;}
    if(hutSleepScene){tickHutSleep(dt);drawHutView();return;}
    if(sleepScene){tickBeachSleep(dt);drawWorld();return;}
    if(!dialoguePinned&&!dialogue.hidden&&(dialogueLeft-=dt)<=0)clearDialogue();
    if(waking){
      waking=Math.max(0,waking-dt);
      if(camInit){cam.x=st.x-VW/2;cam.y=st.y-VH*.48;clampCam();camInit=false;}
      if(!waking)intro();
    }else if(!dialoguePinned){
      advanceCamp(dt);tickIgnition(dt);
      if(insideHut){st.t+=dt;renderHutChoices();hutMonologue();}
      else if(buildMotion)tickBuild(dt);
      else if(!ignition)update(dt);
      survive(dt);if(!insideHut&&!buildMotion)survivalIdeas();renderGauges();
    }
  }
  if(insideHut)drawHutView();else drawWorld();
}
requestAnimationFrame(loop);

// 업데이트 확인 (다른 앱의 version.json이면 무시)
const band=document.getElementById('updBand'); let lastCheck=0, bandClosed=false;
async function checkUpdate(){
  if(!web||bandClosed) return; lastCheck=Date.now();
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(j.app===APP && String(j.v)!==APP_V) band.hidden=false;
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && Date.now()-lastCheck>600000) checkUpdate(); });
document.getElementById('updX').addEventListener('click',()=>{ band.hidden=true; bandClosed=true; });
document.getElementById('updBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('updBtn'),message=band.querySelector('span');
  btn.disabled=true;btn.textContent='바꾸는 중';
  updateRequested=true;
  try{
    const ver=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!ver.ok)throw new Error('version');
    const next=await ver.json();
    const res=await fetch('index.html?t='+Date.now(),{cache:'no-store'});
    const head=(await res.text()).slice(0,600);
    if(!res.ok||next.app!==APP||!head.includes('name="app-id" content="'+APP+'"')||
        !head.includes('name="app-version" content="'+String(next.v)+'"'))throw new Error('build');
    if(worker){
      const registration=(await readyWorker)||await worker.register('sw-castaway-isle.js',workerOptions);
      await registration.update();
      const installing=registration.installing||registration.waiting||registration.active;
      if(!installing)throw new Error('worker');
      if(installing.state!=='activated'){
        await new Promise((resolve,reject)=>{
          function stateChanged(){
            if(installing.state==='activated'||installing.state==='redundant'){
              clearTimeout(timeout);installing.removeEventListener('statechange',stateChanged);
              if(installing.state==='activated')resolve();
              else reject(new Error('worker'));
            }
          }
          const timeout=setTimeout(()=>{
            installing.removeEventListener('statechange',stateChanged);reject(new Error('timeout'));
          },20000);
          installing.addEventListener('statechange',stateChanged);stateChanged();
        });
      }
      const cached=await caches.open(APP+'-'+String(next.v));
      if(!await cached.match('index.html'))throw new Error('cache');
    }
    location.replace(location.pathname+'?v='+String(next.v));
  }catch(e){
    message.textContent='새 버전이 준비되면 다시 눌러 주세요.';
    updateRequested=false;btn.disabled=false;btn.textContent='바꾸기';
  }
});
